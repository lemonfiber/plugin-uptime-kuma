# The proofs this plugin declares.
#
# ─── Why they are not in plugin.toml ─────────────────────────────────────────
#
# `F3-R1` lists a plugin's proofs among the things its manifest declares, and
# `F3-R4` refuses to install a plugin whose proofs do not pass. The manifest
# contract, at `schema_version = 1`, has no block for them: its top-level
# structure is `[plugin]`, `[[service]]` and `[requires]`, and `ARCH-R91`
# requires lemonfiber to *refuse* a manifest carrying a declaration it does not
# recognise rather than skip it. A `[[proof]]` block in plugin.toml today would
# not make this plugin better proved — it would make it uninstallable.
#
# So they are declared here, in the shape they would take in the manifest, and
# they move into it unchanged on the day that block exists.
#
# ─── Why both proofs below are about the body ────────────────────────────────
#
# This service answers **HTTP 200 to every path it does not implement**, serving
# its single-page app as the fallback. `/`, `/metrics`, `/api/push/<anything>`
# and a path invented on the spot all return 200 with the same HTML. A probe
# that read a status here would pass against a build with no API at all — and
# against a container that had been replaced, once Docker's own proxy is in
# front of it.
#
# The second proof exists to pin that. It is not a proof that the service works;
# it is a proof about the property that makes the first proof's shape necessary,
# and if this service ever starts returning 404 for an unimplemented path, the
# proof fails and asks whether the first one can be loosened.

schema_version = 1

[[proof]]
id      = "uptime-kuma.serves"
title   = "Uptime Kuma answers with its own state on the declared health path"
fixture = "fixtures/api-entry-page.json"
why     = """
`/api/entry-page` is the endpoint the manifest's health probe asks for, and the
only one that answers an anonymous caller with JSON about this instance rather
than with the app shell. `type` says which of its three front doors is in force:
`setup-database` before anybody has set it up, and an entry page afterwards.

Both are a service that is answering, which is what the probe is for — so the
proof asserts the field is there and is a string, not which value it holds.
"""
request = { method = "GET", path = "/api/entry-page" }
expect  = { status = 200, content_type = "application/json", json_has_keys = ["type"], json_types = { type = "str" } }

[[proof]]
id      = "uptime-kuma.status-is-not-an-answer"
title   = "An unimplemented path answers 200, so a status proves nothing here"
fixture = "fixtures/api-unimplemented-path.json"
why     = """
Asked for a push endpoint with a token that does not exist, this service returns
200 and its single-page app. That is not a defect — it is how a client-routed
application serves deep links — but it means the usual shorthand for "is it up"
is worthless against this image, and anything that probes it on `/` is measuring
Docker's port proxy.

Recording it makes the reason the health path is `/api/entry-page` reviewable
rather than folklore, and turns a future change in this behaviour into a red
proof rather than a probe that quietly went blind.
"""
request = { method = "GET", path = "/api/push/a-token-that-does-not-exist" }
expect  = { status = 200, content_type = "text/html", json_is_absent = true, body_starts_with = "<!DOCTYPE html>" }
