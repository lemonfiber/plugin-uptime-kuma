[package]
name = "uptime-kuma-adapter"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/plugin-uptime-kuma"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "Speaks lemonfiber's owner.claim contract in front of Uptime Kuma"
publish = false

[[bin]]
name = "uptime-kuma-adapter"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "73539d17ce7497324a03032861dcd4dfdd451f6f" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "73539d17ce7497324a03032861dcd4dfdd451f6f" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "73539d17ce7497324a03032861dcd4dfdd451f6f" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "73539d17ce7497324a03032861dcd4dfdd451f6f" }
lemonfiber-plugin = { git = "https://github.com/lemonfiber/lemonfiber", rev = "73539d17ce7497324a03032861dcd4dfdd451f6f" }
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
