#:schema https://raw.githubusercontent.com/lemonfiber/lemonfiber/73539d17ce7497324a03032861dcd4dfdd451f6f/contract/plugin-manifest.schema.json
# Uptime Kuma, as a lemonfiber plugin.
#
# Contract: https://github.com/lemonfiber/spec/blob/main/20-architecture/contracts/plugin-manifest.md
#
# Everything lemonfiber does on this plugin's behalf comes from this file, and it
# knows nothing about the plugin that is not declared here (ARCH-R83). Nothing in
# it is executable, and nothing in it can be (F3-R1, F3-R6).

schema_version = 1

[plugin]
id          = "uptime-kuma"
name        = "Uptime Kuma"
version     = "1.1.0"
description = "Watches the things the stack depends on and tells you which one went, rather than that something did"
without_it  = "You find out an indexer, a tracker or the connection itself is down from whatever stopped working because of it"
upstream    = "https://github.com/louislam/uptime-kuma"
license     = "MIT"
forms       = ["full"]

# One form, and the widest one. What this watches is the whole stack and the
# things outside it the whole stack needs; an operator running `search` alone has
# nothing for it to do that a glance would not answer faster.

[[service]]
id     = "uptime-kuma"
name   = "Uptime Kuma"
image  = "docker.io/louislam/uptime-kuma"
digest = "sha256:917318f9d7be5257f43ba412c766a473be336eb451d70744f3b482d0c3997c0e"
tag    = "2.5.4"
port   = 3001
# Admin, not household. It holds the credentials for every notification channel
# it sends on, and it can be pointed at any address this machine can reach. That
# is the tier the *arrs are in, and it is also why the `[[wiring]]` below names no
# hostname: a loopback service does not get one, and there is no field by which
# it could ask (ARCH-R104).
bind   = "loopback"
# This service answers 200 with its single-page app for every path it does not
# implement, so a probe on `/` would pass against a build with no API at all.
# `/api/entry-page` is the one that answers with its own state. The second proof
# below pins that property so this line cannot quietly go blind.
health = { kind = "http", path = "/api/entry-page", timeout_s = 90 }
criticality = "enhancing"

# It watches endpoints. It reads no library, so the data root is not mounted and
# it declares no media type.
takes_data  = false

# The line this plugin exists to demonstrate.
#
# This image has no /config. It keeps its database, its uploads and its
# notification configuration at /app/data, and before `config_path` existed the
# generated container mounted a directory the application never reads. Running
# as the image's own user that installed cleanly, answered its health probe, and
# lost every monitor the moment the container was replaced; running as a
# non-root user it did not start at all, because /app/data in the image is not
# writable by anybody else.
#
# One directory, one mount, the source still lemonfiber's. Only the target is
# named here. See spec#386 for the run that showed both halves.
config_path = "/app/data"

# What it can do (F4-R1), namespaced with the plugin's id (F4-R4).
#
# The core vocabulary exists now, and neither of these is in it. That was the
# prediction here before it was published and it is the right answer rather than
# a gap: F9-R3 keeps a capability nothing bundled implements out of the core set,
# nothing bundled watches endpoints, and a namespace is exactly what an ecosystem
# vocabulary is for. `lemonfiber plugin claims` holds this manifest to the
# vocabulary of the release `targets.toml` names on every CI run.
provides = [
    "uptime-kuma:endpoint-monitor",
    "uptime-kuma:status-page",
]

# SQLite, chosen here rather than on Uptime Kuma's first screen, so the database
# exists from its first start and the first run asks for nothing but the
# administrator.
[service.env]
UPTIME_KUMA_DB_TYPE = "sqlite"

# A list, and one entry, because wiring is a fact about a service rather than
# about a plugin (ARCH-R127). One service here, so the entry names none.
[[service]]
id          = "uptime-kuma-adapter"
name        = "Uptime Kuma adapter"
image       = "ghcr.io/lemonfiber/uptime-kuma-adapter"
digest      = "sha256:add1d650380caac77adedc65b42ec6c31f31d8811aea2a3369a6d12387e2021f"
tag         = "main-bc3eec9e8eae"
criticality = "enhancing"
reaches     = ""
asks_for    = "Nothing beyond this machine. It answers lemonfiber's owner.claim contract by setting up and signing in to Uptime Kuma, beside it, as the administrator lemonfiber minted for it."
config_path = "/config"
listens     = 8080
speaks      = ["owner.claim@1"]
fronts      = "uptime-kuma"
upstream    = { username = { secret = "admin-username" }, password = { secret = "admin-password" } }

[[secret]]
id     = "admin-username"
of     = "uptime-kuma"
minted = true
why    = "The name of the administrator Uptime Kuma is claimed for, which the adapter in front of it signs in as"

[[secret]]
id     = "admin-password"
of     = "uptime-kuma"
minted = "password"
why    = "The password of the administrator Uptime Kuma is claimed for, which the adapter in front of it signs in with, in the shape Uptime Kuma's password strength check accepts"

[[wiring]]
# No `hostname`. The tier decided that, not this plugin.
service         = "uptime-kuma"
dashboard_group = "Automation"

[requires]
capabilities = ["doctor.contribute"]

# ─── Proofs ──────────────────────────────────────────────────────────────────
#
# Every one asserts a body, and here that is not a stylistic preference. Measured,
# before this service's database exists and after:
#
#                                    before                     after
#   /api/entry-page              ->  200 {"type":"setup-…"}     200 {"type":"entryPage"}
#   /api/not-a-real-path         ->  200 <!DOCTYPE html>…       200 <!DOCTYPE html>…
#   /api/push/abc123             ->  200 <!DOCTYPE html>…       404 {"ok":false,…}
#   /api/status-page/nonexistent ->  200 <!DOCTYPE html>…       404 {"status":"fail"…}
#
# A proof reading a status here would pass against a build with no API at all.
# The right-hand column is why the second proof asks `/api/not-a-real-path`: the
# push path answers the app shell only while there is no database, so a proof
# over it describes a fresh container rather than this image.

[[proof]]
id      = "uptime-kuma.serves"
service = "uptime-kuma"
title   = "Uptime Kuma answers with its own state on the declared health path"
fixture = "fixtures/api-entry-page.json"
why     = """
`/api/entry-page` is the endpoint the health probe asks for, and the only one
that answers an anonymous caller with JSON about this instance rather than with
the app shell. `type` says which front door is in force: `entryPage` here, since
the environment names the database and Uptime Kuma makes it at start, and
`setup-database` where an image asked for one on its first screen.

Both are a service that is answering, which is what the probe is for — so this
asserts the field is present and is a string, not which value it holds.
"""
request = { method = "GET", path = "/api/entry-page" }
expect  = { status = 200, content_type = "application/json", json_has_keys = ["type"], json_types = { type = "str" } }

[[proof]]
id      = "uptime-kuma.status-is-not-an-answer"
service = "uptime-kuma"
title   = "An unimplemented path answers 200, so a status proves nothing here"
fixture = "fixtures/api-unimplemented-path.json"
why     = """
Asked for a path it implements at all, this service returns 200 and its
single-page app. That is not a defect — it is how a client-routed application
serves deep links — but it means the usual shorthand for "is it up" is worthless
against this image.

Recording it makes the reason the health path is `/api/entry-page` reviewable
rather than folklore, and turns a future change in this behaviour into a red
proof rather than a probe that has quietly gone blind.

It asks `/api/not-a-real-path` rather than a push endpoint with a token that does
not exist, and the difference was found by running it. The push path answers the
app shell only while this service has no database; once it has one, that path is
a real endpoint answering a real 404. A proof over it described a fresh container
rather than this image — it passed against its recording and failed against a
running instance, which is what a fixture drifting looks like from the outside.
"""
request = { method = "GET", path = "/api/not-a-real-path" }
expect  = { status = 200, content_type = "text/html", json_is_absent = true, body_starts_with = "<!DOCTYPE html>" }

# ─── Contributions ───────────────────────────────────────────────────────────
#
# A row in a register lemonfiber already runs, never an interpreter of its own
# (F3-R26). Both capabilities above are inert, so this is where this plugin is
# useful rather than merely readable: it adds one thing lemonfiber will say
# about the stack that lemonfiber could not have known to say.
#
# It asks something no credential is needed for, deliberately. This service has
# no REST API beyond what an anonymous caller can reach — everything else is
# socket.io — so a check needing a credential would report `unrun` on every
# doctor run until recipes arrive, and a check that quietly never runs is worse
# than one that fails.

[[contribution]]
at        = "doctor.check"
id        = "uptime-kuma:api-still-answers-json"
service   = "uptime-kuma"
title     = "The path the health probe asks for still answers with this service's own state"
category  = "config"
timeout_s = 10
fixture   = "fixtures/api-entry-page-state.json"
why       = """
This image answers 200 with its single-page app for every path it does not
implement. That is how a client-routed application serves deep links, and it
means a health probe here can go blind without going red: if `/api/entry-page`
ever stopped being an API path, the probe would keep passing against the app
shell and lifecycle would keep waiting on nothing.

A proof asks this once, at install. This asks it on every doctor run, which is
when an image bump could have moved it.
"""
request   = { method = "GET", path = "/api/entry-page" }
expect    = { status = 200, content_type = "application/json", json_has_keys = ["type"] }

[[contribution]]
at     = "doctor.remedy"
id     = "uptime-kuma:the-probe-has-gone-blind"
for    = "uptime-kuma:api-still-answers-json"
action = "Treat the health probe as unproven and pin the image back until the path is confirmed"
why    = """
The path lifecycle waits on is answering the application shell rather than this
service's own state, so a passing health probe is no longer evidence that
anything inside is listening.
"""
detail = """
This service answers 200 with its single-page app for every unimplemented path,
so an API path that has moved looks identical to one that is working. The
recorded responses in this repository name the digest they came from; comparing
them against the running image is what tells you which release moved it.
"""
