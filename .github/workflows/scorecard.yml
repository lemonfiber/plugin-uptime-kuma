# The supply-chain posture check (Q-R56, Q-R59), called from spec.
name: scorecard
on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: "24 6 * * 1"
permissions:
  contents: read
jobs:
  scorecard:
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
    uses: lemonfiber/spec/.github/workflows/scorecard.yml@9f879de52cf8170fea19d67ce6b014e61cd3c3bc # v1.0.104
