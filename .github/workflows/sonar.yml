# Gate pull requests on zero SonarCloud issues (Q-R64). The scan is
# SonarCloud's Automatic Analysis; the shared gate reads its summary.
name: sonar
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  gate:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@72472b4a5b35e3edf9a6a539f23f5b0eb528d878 # v1.0.78
    with:
      allowed-open: 0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
