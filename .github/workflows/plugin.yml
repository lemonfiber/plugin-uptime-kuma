# What this repository says about its own plugin, before anybody reads the diff.
#
# `F3-R9` asks for the manifest schema to be validated in CI so a malformed
# contribution is caught before merge, and `F5-R2` asks for every declared proof
# to run. `F10-R7` is the reason both run *here* rather than only in the
# catalogue: an author's own repository has to run the same commands the
# catalogue runs, or the first time a plugin meets them is in somebody else's
# pull request.
#
# The schema they are run against is lemonfiber's, generated from the types it
# reads a manifest with and fetched on every run rather than copied once
# (`ARCH-R92`). Nothing here describes the format; `F10-R2` forbids a second
# description beside the generated one, and the harness carries none.
#
# The commands are still not the ones it will run. lemonfiber validating a
# manifest itself is `F10-R3` and nothing ships it yet; `targets.toml` names the
# release that will, and `.github/interim/` stands in until the reader arrives.
# The `reader` job below is what ends the arrangement: it fails the day that
# release is out, rather than letting the stand-in quietly outlive it.
name: plugin
on: [pull_request]
permissions:
  contents: read

jobs:
  # Against everything lemonfiber publishes, in one pass, every violation named
  # with its location. The self-test runs first: a gate nobody has seen fail is a
  # gate nobody knows the shape of.
  #
  # One job rather than two. The schema, the capability vocabulary and the
  # extension points are one set, fetched together, and splitting them left half
  # the rules deciding nothing on a run of their own.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The one dependency this harness has, and it is a schema reader
        run: |
          pip install --disable-pip-version-check --only-binary :all: jsonschema==4.25.1
      - name: The stand-in refuses what it exists to refuse
        run: python3 .github/interim/validate.py --self-test
      - name: plugin.toml, against what lemonfiber publishes now
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/interim/published_gate.py

  # Against the recordings, which is what lets this run with no live instance
  # anywhere (F10-R4). A proof that could not be run is reported unproven and is
  # not counted as a pass (F3-R5). The report is committed, so a run that would
  # write a different one fails rather than silently disagreeing with the record
  # the release train reads.
  #
  # The verdicts are the reader's own. `lemonfiber plugin claims` runs every
  # bound probe, every proof and every contributed check against the recording
  # it names, and `prove.py` asks it and writes down what it said — because a
  # second evaluator in Python is free to disagree with the one an operator
  # runs, and did.
  #
  # Building it from source is what that costs until the release `targets.toml`
  # names is out. The checkout is at `main` and unpinned, for the same reason
  # `published_gate.py` reads the contract at `main`: what this plugin is held
  # to is what lemonfiber decides now, not what it decided when somebody wrote a
  # pin down.
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lemonfiber/lemonfiber
          ref: main
          path: .reader
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .reader
      - name: The reader whose verdicts these are
        run: cargo build --quiet --release -p lemonfiber --manifest-path .reader/Cargo.toml
      - name: Everything this manifest declares, against the recorded responses
        env:
          LEMONFIBER: ${{ github.workspace }}/.reader/target/release/lemonfiber
        run: python3 .github/interim/prove.py --report proofs.json
      # A bare `git diff --exit-code` prints a diff and no reason for it, which
      # leaves whoever reads it to work out both what the file is and which of
      # the two copies is wrong. Neither is: the committed one is a record and
      # the run just wrote the current one.
      - name: The committed report is the one this run would write
        run: |
          if git diff --exit-code -- proofs.json; then exit 0; fi
          echo "::error::proofs.json is not what this run writes. It is the record \
          the release train reads, so it is generated and committed together with \
          the manifest it is about: run \`python3 .github/interim/prove.py --report \
          proofs.json\` with a lemonfiber on the path, and commit the result. The \
          diff above is the committed file against what this run produced (F3-R5)."
          exit 1

  # The declared digest is in the registry, the tag beside it still names it,
  # and whether anything signed it — reported as unproven where nothing did,
  # never as verified (F3-R25).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The image this plugin installs
        run: python3 .github/interim/image_gate.py

  # A register pointing the other way: it fails when the thing this harness
  # stands in for arrives, so a stand-in cannot quietly outlive it.
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Has the reader this stands in for arrived
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/interim/reader_gate.py

  # `.github/interim/` exists byte for byte in three plugin repositories, and
  # `plugin-template` is where it is written. A copy that has quietly drifted is
  # worse than none, because it is trusted: the gate here would go on reporting
  # passes the template's own rules no longer grant.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The harness here is the template's harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone lemonfiber/plugin-template "$RUNNER_TEMP/template" -- --depth 1
          diff -ru "$RUNNER_TEMP/template/.github/interim" .github/interim
