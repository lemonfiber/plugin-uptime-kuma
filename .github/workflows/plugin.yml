# What this repository says about its own plugin, before anybody reads the diff.
#
# `F3-R9` asks for the manifest schema to be validated in CI so a malformed
# contribution is caught before merge, and `F5-R2` asks for every declared proof
# to run. `F10-R7` is the reason both run *here* rather than only in the
# catalogue: an author's own repository has to run the same commands the
# catalogue runs, or the first time a plugin meets them is in somebody else's
# pull request.
#
# Every verdict is lemonfiber's own: `.github/reader/reader.py` fetches the
# release `targets.toml` names, checks it against the digest published with it,
# and asks it `lemonfiber plugin claims` and `lemonfiber plugin provenance`
# about this directory (`F10-R3`). Nothing here describes the format; `F10-R2`
# forbids a second description beside the generated one.
name: plugin
on: [pull_request]
permissions:
  contents: read

jobs:
  # The release `targets.toml` names is out, is the file its published digest
  # names, and reads this plugin. What it says is printed whole, and a capability
  # the release does not offer a plugin is reported as a notice: naming a
  # release is not a claim the plugin installs on it (`REPO-R56`, `F3-R21`).
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The release this plugin names, and what it says of it
        run: python3 .github/reader/reader.py reader

  # Every refusal the release makes of the manifest, each named with its location:
  # the schema, the capability vocabulary and the extension points it publishes,
  # and the rules that read the manifest as a whole.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: plugin.toml, as the release reads it
        run: python3 .github/reader/reader.py manifest

  # Every probe, proof and contributed check, against the recording it names,
  # which is what lets this run with no live instance anywhere (F10-R4). Anything
  # that did not pass fails, unproven included (F3-R5). The report is committed,
  # so a run that would write a different one fails rather than silently
  # disagreeing with the record the release train reads.
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Everything this manifest declares, against the recorded responses
        run: python3 .github/reader/reader.py proofs
      # A bare `git diff --exit-code` prints a diff and no reason for it, which
      # leaves whoever reads it to work out both what the file is and which of
      # the two copies is wrong. Neither is: the committed one is a record and
      # the run just wrote the current one.
      - name: The committed report is the one this run would write
        run: |
          if git diff --exit-code -- proofs.json; then exit 0; fi
          echo "::error::proofs.json is not what this run writes. It is the record \
          the release train reads, so it is generated and committed together with \
          the manifest it is about: run \`python3 .github/reader/reader.py proofs\` \
          and commit the result. The diff above is the committed file against what \
          this run produced (F3-R5)."
          exit 1

  # Every pinned digest is in its registry and the tag beside it still names it
  # (F3-R8), and what vouches for each image, reported as unproven where nothing
  # does and never as verified (F3-R25).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The images this plugin installs
        run: python3 .github/reader/reader.py image

  # `.github/reader/` exists byte for byte in every plugin repository, and
  # `plugin-template` is where it is written. A copy that has quietly drifted is
  # worse than none, because it is trusted: the gate here would go on asking the
  # release questions the template's own copy no longer asks.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The harness here is the template's harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone lemonfiber/plugin-template "$RUNNER_TEMP/template" -- --depth 1
          diff -ru "$RUNNER_TEMP/template/.github/reader" .github/reader
